<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fortnite: Snake Royale - Autoplay & Mobile Edition</title>
    <!-- Paho MQTT cez CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&display=swap');

        :root {
            --fn-yellow: #ffe600;
            --fn-blue: #00d2ff;
            --fn-purple: #a855f7;
            --fn-dark: #090d16;
            --fn-panel: rgba(14, 20, 36, 0.92);
            --vip-gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Zákaz zoomu a nechceného scrollovania na mobile */
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--fn-dark);
            font-family: 'Montserrat', sans-serif;
            color: #fff;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HORNÝ PROFILOVÝ STATUS */
        .user-top-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--fn-panel);
            padding: 6px 14px;
            border-radius: 40px;
            border: 2px solid rgba(255, 230, 0, 0.35);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            z-index: 30;
        }

        .avatar-img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--fn-yellow);
        }

        .badge-vip {
            background: linear-gradient(135deg, #f59e0b, #ffe600);
            color: #000;
            font-size: 8px;
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .badge-free {
            background: #475569;
            color: #cbd5e1;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
        }

        /* FORTNITE HUD TOP */
        .hud-center {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--fn-panel);
            padding: 8px 20px;
            border-radius: 35px;
            border: 2px solid var(--fn-yellow);
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.25);
            z-index: 20;
        }

        .hud-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-title {
            font-size: 8px;
            font-weight: 900;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hud-val {
            font-family: 'Luckiest Guy', cursive;
            font-size: 20px;
            color: var(--fn-yellow);
            text-shadow: 2px 2px 0 #000;
        }

        /* TLAČIDLO AUTOPLAY BOT (GUI) */
        .autoplay-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 40;
            background: #1e293b;
            color: #94a3b8;
            border: 2px solid #475569;
            padding: 8px 16px;
            border-radius: 30px;
            font-family: 'Luckiest Guy', cursive;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .autoplay-btn.active {
            background: linear-gradient(135deg, #10b981, #00ff88);
            color: #000;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            transform: scale(1.05);
        }

        /* SHIELD & HP BARY */
        .hud-bottom-left {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
            background: rgba(14, 20, 36, 0.88);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bar-wrap {
            width: 160px;
            height: 12px;
            background: #1e293b;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill-shield { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); transition: width .15s; }
        .bar-fill-health { height: 100%; background: linear-gradient(90deg, #16a34a, #4ade80); transition: width .15s; }
        .bar-txt {
            position: absolute; inset: 0;
            text-align: center; font-size: 8px; font-weight: 900; line-height: 12px;
            text-shadow: 1px 1px 1px #000;
        }

        /* MOBILNÉ TLAČIDLO PRE SPRINT/BOOST */
        .mobile-boost-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #ffe600);
            border: 3px solid #fff;
            color: #000;
            font-family: 'Luckiest Guy', cursive;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.5);
            z-index: 40;
            cursor: pointer;
            touch-action: manipulation;
        }

        .mobile-boost-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 10px rgba(255, 230, 0, 0.3);
        }

        /* LIVE KILL FEED */
        .kill-feed {
            position: absolute;
            top: 75px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 20;
            pointer-events: none;
            max-width: 250px;
        }

        .kill-row {
            background: rgba(0, 0, 0, 0.75);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            border-left: 4px solid #ef4444;
            animation: fadeOut 5s forwards;
        }

        /* MODÁL: VEREJNÁ SIEŤ ÚČTOV */
        .modal-screen {
            position: absolute;
            inset: 0;
            background: rgba(6, 9, 18, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .lobby-box {
            background: #131a2e;
            border: 3px solid var(--fn-yellow);
            border-radius: 20px;
            width: 780px;
            max-width: 95vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(255, 230, 0, 0.25);
            overflow: hidden;
        }

        .lobby-header {
            padding: 16px;
            background: #0d1424;
            border-bottom: 2px solid #233152;
            text-align: center;
        }

        .lobby-header h1 {
            font-family: 'Luckiest Guy', cursive;
            font-size: 28px;
            color: var(--fn-yellow);
            text-shadow: 2px 2px 0 #000;
        }

        .lobby-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .lobby-left {
            flex: 1;
            padding: 20px;
            border-right: 2px solid #233152;
            overflow-y: auto;
        }

        .lobby-right {
            flex: 1.2;
            padding: 20px;
            background: #0f172a;
            overflow-y: auto;
        }

        @media (max-width: 720px) {
            .lobby-content { flex-direction: column; overflow-y: auto; }
            .lobby-left { border-right: none; border-bottom: 2px solid #233152; }
            .hud-center { gap: 10px; padding: 6px 14px; }
            .hud-val { font-size: 16px; }
            .hud-title { font-size: 7px; }
            .bar-wrap { width: 120px; }
            .mobile-boost-btn { width: 65px; height: 65px; font-size: 11px; bottom: 20px; right: 20px; }
        }

        .f-input {
            width: 100%;
            background: #0a0f1d;
            border: 2px solid #334155;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            margin-bottom: 10px;
        }

        .btn-yellow {
            width: 100%;
            background: var(--fn-yellow);
            color: #000;
            font-family: 'Luckiest Guy', cursive;
            font-size: 18px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 0 #b3a100;
            transition: .1s;
        }

        .public-accounts-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .public-account-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .acc-info { display: flex; align-items: center; gap: 8px; }
        .acc-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }

        /* VICTORY OVERLAY */
        #victory-screen {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.45) 0%, rgba(10, 10, 20, 0.96) 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 80;
        }

        .vic-title {
            font-family: 'Luckiest Guy', cursive;
            font-size: 50px;
            color: var(--fn-yellow);
            text-shadow: 4px 5px 0 #000, 0 0 35px var(--fn-yellow);
            transform: rotate(-3deg);
            margin-bottom: 15px;
        }

        @keyframes fadeOut {
            0% { opacity: 0; transform: translateX(20px); }
            10% { opacity: 1; transform: translateX(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- TLAČIDLO PRE AUTOPLAY BOT (GUI) -->
    <button id="btn-autoplay" class="autoplay-btn">
        <span>🤖 AUTOPLAY:</span> <b id="autoplay-status">OFF</b>
    </button>

    <!-- HORNÝ STATUS PRIHLÁSENÉHO HRÁČA -->
    <div class="user-top-badge" id="profile-pill" style="display:none;">
        <img id="pill-avatar" class="avatar-img" src="" alt="Avatar">
        <div style="display:flex; flex-direction:column; text-align:left;">
            <div style="font-size:12px; font-weight:900; display:flex; align-items:center; gap:4px;">
                <span id="pill-nick">Player</span>
                <span id="pill-tier" class="badge-free">FREE</span>
            </div>
            <span style="font-size: 9px; color:#94a3b8;" id="pill-wins">Wins: 0</span>
        </div>
        <button id="btn-buy-vip" style="background:linear-gradient(135deg, #f59e0b, #ffe600); color:#000; font-weight:900; font-size:10px; padding:4px 8px; border-radius:6px; border:none; cursor:pointer; margin-left:6px;">👑 VIP</button>
        <button id="btn-logout" style="background:transparent; border:none; color:#ef4444; font-weight:800; cursor:pointer; font-size:10px;">X</button>
    </div>

    <!-- FORTNITE BATTLE ROYALE HUD -->
    <div class="hud-center">
        <div class="hud-stat">
            <span class="hud-title">NAŽIVE</span>
            <span class="hud-val" id="hud-alive">45</span>
        </div>
        <div class="hud-stat">
            <span class="hud-title">KILLS</span>
            <span class="hud-val" id="hud-kills">0</span>
        </div>
        <div class="hud-stat">
            <span class="hud-title" style="color:#d946ef;">BÚRKA</span>
            <span class="hud-val" style="color:#d946ef;" id="hud-storm-timer">03:00</span>
        </div>
        <div class="hud-stat">
            <span class="hud-title">DĹŽKA</span>
            <span class="hud-val" id="hud-len">18</span>
        </div>
    </div>

    <!-- SHIELD & HP BARY -->
    <div class="hud-bottom-left">
        <div class="bar-wrap">
            <div class="bar-fill-shield" id="bar-shield" style="width: 100%;"></div>
            <div class="bar-txt">SHIELD <span id="val-shield">100</span></div>
        </div>
        <div class="bar-wrap">
            <div class="bar-fill-health" id="bar-health" style="width: 100%;"></div>
            <div class="bar-txt">ZDRAVIE <span id="val-health">100</span></div>
        </div>
    </div>

    <!-- MOBILNÉ SPRINT TLAČIDLO -->
    <div class="mobile-boost-btn" id="mobile-boost-btn">
        <span>🚀</span>
        <span>BOOST</span>
    </div>

    <!-- LIVE KILL FEED -->
    <div class="kill-feed" id="kill-feed"></div>

    <!-- VICTORY ROYALE #1 -->
    <div id="victory-screen">
        <h1 class="vic-title">#1 VICTORY ROYALE</h1>
        <p style="font-size: 18px; font-weight: 800; margin-bottom: 20px;">Vyhral si zápas v Snake Royale!</p>
        <button class="btn-yellow" style="max-width: 200px;" onclick="location.reload()">HRAŤ ZNOVA</button>
    </div>

    <!-- MODÁL: VEREJNÁ SIEŤ ÚČTOV A ŠTART HRY -->
    <div class="modal-screen" id="auth-modal">
        <div class="lobby-box">
            <div class="lobby-header">
                <h1>FORTNITE SNAKE ROYALE</h1>
                <p style="font-size: 11px; color:#94a3b8; margin-top: 2px;">Mobil & PC | Autoplay Bot | EMQX Cloud</p>
            </div>

            <div class="lobby-content">
                <div class="lobby-left">
                    <h3 style="font-size:13px; margin-bottom:10px; color:var(--fn-yellow);">VYTVORIŤ VEREJNÝ ÚČET</h3>
                    <input type="text" id="reg-username" class="f-input" placeholder="Epic GamerTag (napr. Pro_Snake)">
                    
                    <div style="font-size:10px; color:#94a3b8; margin-bottom:4px;">PROFILOVÁ FOTKA (VAULT KATALÓG):</div>
                    <input type="file" id="reg-avatar-file" class="f-input" accept="image/*">

                    <button class="btn-yellow" id="btn-submit-register">ZAREGISTROVAŤ A HRAŤ</button>
                </div>

                <div class="lobby-right">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="font-size:13px; color:var(--fn-blue);">VEREJNÉ ÚČTY V CLOUDE</h3>
                        <span id="users-count" style="font-size:10px; color:#94a3b8;">0 účtov</span>
                    </div>
                    <div class="public-accounts-list" id="public-accounts-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =======================================================
        // 1. EMQX CLOUD MQTT ARCHITEKTÚRA
        // =======================================================
        const MQTT_BROKER = "broker.emqx.io";
        const MQTT_PORT = 8084;
        const MQTT_PATH = "/mqtt";
        const CLIENT_ID = "fn_mob_" + Math.random().toString(16).substring(2, 10);

        const TOPIC_VAULT = "dankermax/v1/vault_catalog";
        const TOPIC_USERS = "dankermax/v1/users_registry";
        const TOPIC_REPORTS = "dankermax/v1/reports_queue";
        const TOPIC_MP_POS = "dankermax/v1/snake_game/positions/";

        let mqttClient = null;
        let isMqttConnected = false;

        let cloudUsersRegistry = {};
        let cloudVaultCatalog = [];
        let currentUser = JSON.parse(localStorage.getItem("fn_cloud_session")) || null;

        const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffe600'/><circle cx='35' cy='42' r='8' fill='%23000'/><circle cx='65' cy='42' r='8' fill='%23000'/><path d='M30 65 Q50 85 70 65' stroke='%23000' stroke-width='6' fill='none'/></svg>";

        function connectMQTT() {
            mqttClient = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, MQTT_PATH, CLIENT_ID);

            mqttClient.onConnectionLost = () => {
                isMqttConnected = false;
                setTimeout(connectMQTT, 3000);
            };

            mqttClient.onMessageArrived = (message) => {
                try {
                    const topic = message.destinationName;
                    const payload = JSON.parse(message.payloadString);

                    if (topic === TOPIC_USERS) {
                        cloudUsersRegistry = Object.assign(cloudUsersRegistry, payload);
                        localStorage.setItem("fn_cached_registry", JSON.stringify(cloudUsersRegistry));
                        renderPublicAccountsList();

                        if (currentUser && cloudUsersRegistry[currentUser.username]) {
                            currentUser = cloudUsersRegistry[currentUser.username];
                            localStorage.setItem("fn_cloud_session", JSON.stringify(currentUser));
                            updateProfileUI();
                        }
                    }

                    if (topic === TOPIC_VAULT) {
                        cloudVaultCatalog = payload;
                    }

                    if (topic.startsWith(TOPIC_MP_POS)) {
                        const sender = topic.split("/").pop();
                        if (currentUser && sender !== currentUser.username && payload.alive) {
                            remoteSnakes[sender] = { ...payload, lastUpdate: Date.now() };
                        } else if (!payload.alive) {
                            delete remoteSnakes[sender];
                        }
                    }
                } catch (e) {}
            };

            mqttClient.connect({
                useSSL: true,
                timeout: 5,
                onSuccess: () => {
                    isMqttConnected = true;
                    mqttClient.subscribe(TOPIC_USERS, { qos: 1 });
                    mqttClient.subscribe(TOPIC_VAULT, { qos: 1 });
                    mqttClient.subscribe(TOPIC_MP_POS + "+", { qos: 0 });

                    if (currentUser) applyLogin(currentUser);
                },
                onFailure: () => setTimeout(connectMQTT, 4000)
            });
        }

        function pushUserRegistryToCloud() {
            if (!isMqttConnected) return;
            const msg = new Paho.MQTT.Message(JSON.stringify(cloudUsersRegistry));
            msg.destinationName = TOPIC_USERS;
            msg.retained = true;
            msg.qos = 1;
            mqttClient.send(msg);
        }

        function pushPhotoToVaultCatalog(photoObj) {
            if (!isMqttConnected) return;
            cloudVaultCatalog.push(photoObj);
            const msg = new Paho.MQTT.Message(JSON.stringify(cloudVaultCatalog));
            msg.destinationName = TOPIC_VAULT;
            msg.retained = true;
            msg.qos = 1;
            mqttClient.send(msg);
        }

        function pushReportToQueue(action, details) {
            if (!isMqttConnected) return;
            const report = {
                id: "REP_" + Date.now(),
                action: action,
                user: currentUser ? currentUser.username : "guest",
                details: details,
                timestamp: new Date().toISOString()
            };
            const msg = new Paho.MQTT.Message(JSON.stringify(report));
            msg.destinationName = TOPIC_REPORTS;
            msg.qos = 0;
            mqttClient.send(msg);
        }

        // =======================================================
        // 2. VEREJNÉ ÚČTY UI
        // =======================================================
        function renderPublicAccountsList() {
            const list = document.getElementById("public-accounts-list");
            const keys = Object.keys(cloudUsersRegistry);
            document.getElementById("users-count").innerText = `${keys.length} účtov`;

            if (keys.length === 0) {
                list.innerHTML = `<div style="font-size:11px; color:#64748b;">Žiadne účty. Vytvor si prvý!</div>`;
                return;
            }

            list.innerHTML = keys.map(key => {
                const u = cloudUsersRegistry[key];
                return `
                    <div class="public-account-card">
                        <div class="acc-info">
                            <img src="${u.avatar || DEFAULT_AVATAR}" class="acc-avatar">
                            <div>
                                <div style="font-size:11px; font-weight:800;">
                                    ${u.username} 
                                    ${u.tier === 'premium' ? '<span class="badge-vip">VIP</span>' : '<span class="badge-free">FREE</span>'}
                                </div>
                                <div style="font-size:9px; color:#94a3b8;">Výhry: <b>${u.wins || 0}</b></div>
                            </div>
                        </div>
                        <button onclick="selectPublicAccount('${u.username}')" style="background:var(--fn-blue); border:none; color:#000; font-weight:900; font-size:10px; padding:5px 8px; border-radius:6px; cursor:pointer;">HRAŤ</button>
                    </div>
                `;
            }).join('');
        }

        window.selectPublicAccount = (username) => {
            const user = cloudUsersRegistry[username];
            if (user) {
                pushReportToQueue("USER_LOGIN", { username: user.username });
                applyLogin(user);
            }
        };

        document.getElementById("btn-submit-register").onclick = () => {
            const username = document.getElementById("reg-username").value.trim();
            const avatarFile = document.getElementById("reg-avatar-file").files[0];

            if (!username) { alert("Zadaj Epic GamerTag!"); return; }
            if (cloudUsersRegistry[username]) { alert("Tento účet už existuje!"); return; }

            if (avatarFile) {
                const reader = new FileReader();
                reader.onload = (e) => completeRegistration(username, e.target.result);
                reader.readAsDataURL(avatarFile);
            } else {
                completeRegistration(username, DEFAULT_AVATAR);
            }
        };

        function completeRegistration(username, avatarBase64) {
            const newUser = {
                id: "USR_" + Date.now(),
                username: username,
                tier: "free",
                wins: 0,
                kills: 0,
                avatar: avatarBase64,
                createdAt: new Date().toISOString()
            };

            pushPhotoToVaultCatalog({
                id: "IMG_" + Date.now(),
                name: username + "_avatar",
                base64: avatarBase64,
                tier: "free",
                timestamp: Date.now()
            });

            cloudUsersRegistry[username] = newUser;
            pushUserRegistryToCloud();
            pushReportToQueue("USER_REGISTERED", { username: username });

            applyLogin(newUser);
        }

        function applyLogin(user) {
            currentUser = user;
            localStorage.setItem("fn_cloud_session", JSON.stringify(currentUser));

            document.getElementById("auth-modal").style.display = "none";
            document.getElementById("profile-pill").style.display = "flex";

            player.nick = user.username;
            player.color = user.tier === "premium" ? "#ffd700" : "#22c55e";

            updateProfileUI();
            startGame();
        }

        function updateProfileUI() {
            if (!currentUser) return;
            document.getElementById("pill-nick").innerText = currentUser.username;
            document.getElementById("pill-avatar").src = currentUser.avatar || DEFAULT_AVATAR;
            document.getElementById("pill-wins").innerText = `Wins: ${currentUser.wins || 0}`;

            const tierSpan = document.getElementById("pill-tier");
            const btnVip = document.getElementById("btn-buy-vip");

            if (currentUser.tier === "premium") {
                tierSpan.className = "badge-vip";
                tierSpan.innerText = "VIP";
                btnVip.style.display = "none";
            } else {
                tierSpan.className = "badge-free";
                tierSpan.innerText = "FREE";
                btnVip.style.display = "inline-block";
            }
        }

        document.getElementById("btn-buy-vip").onclick = () => {
            if (!currentUser) return;
            currentUser.tier = "premium";
            cloudUsersRegistry[currentUser.username] = currentUser;
            pushUserRegistryToCloud();
            pushReportToQueue("PURCHASE_VIP_PASS", { username: currentUser.username });
            player.color = "#ffd700";
            updateProfileUI();
            addKillFeed("SYSTEM", `${currentUser.username} odomkol BATTLE PASS VIP! 👑`);
        };

        document.getElementById("btn-logout").onclick = () => {
            localStorage.removeItem("fn_cloud_session");
            location.reload();
        };

        // =======================================================
        // 3. AUTOPLAY BOT LOGIKA (GUI TRIGGER)
        // =======================================================
        let isAutoplay = false;
        const btnAutoplay = document.getElementById("btn-autoplay");
        const autoplayStatus = document.getElementById("autoplay-status");

        btnAutoplay.addEventListener("click", () => {
            isAutoplay = !isAutoplay;
            if (isAutoplay) {
                btnAutoplay.classList.add("active");
                autoplayStatus.innerText = "ON (AKTÍVNY)";
                addKillFeed("AUTOPLAY", "Umelá inteligencia riadi hadíka!");
            } else {
                btnAutoplay.classList.remove("active");
                autoplayStatus.innerText = "OFF";
            }
        });

        // AI funkcia pre Autoplay Bota
        function runAutoplayAI() {
            if (!isAutoplay || !player.alive) return;

            // 1. Priorita: Vyhnutie sa búrke
            let distFromStormCenter = Math.hypot(player.x - storm.x, player.y - storm.y);
            if (distFromStormCenter > storm.radius * 0.72) {
                // Rýchlo nasmerovať do stredu bezpečnej zóny
                player.angle = Math.atan2(storm.y - player.y, storm.x - player.x);
                isBoosting = true;
                return;
            }

            // 2. Priorita: Vyhľadanie najlepšieho lootu (Drop, Slurp, alebo XP)
            let targetLoot = null;
            let minDist = 999999;

            for (let loot of lootItems) {
                let d = Math.hypot(player.x - loot.x, player.y - loot.y);
                // Uprednostniť Supply Drop a Slurp
                let weight = (loot.type === "drop") ? 0.3 : (loot.type === "slurp" ? 0.6 : 1.0);
                let scoreDist = d * weight;

                if (scoreDist < minDist) {
                    minDist = scoreDist;
                    targetLoot = loot;
                }
            }

            if (targetLoot) {
                player.angle = Math.atan2(targetLoot.y - player.y, targetLoot.x - player.x);
            }

            // 3. Priorita: Vyhýbanie sa veľkým botom
            for (let b of bots) {
                if (b.alive) {
                    let dB = Math.hypot(player.x - b.x, player.y - b.y);
                    if (dB < 160 && b.length > player.length) {
                        // Únik v opačnom smere!
                        player.angle = Math.atan2(player.y - b.y, player.x - b.x);
                        isBoosting = true;
                        return;
                    }
                }
            }

            // Šetrenie štítu, boost len občas
            isBoosting = (minDist < 120 && targetLoot && targetLoot.type === "drop");
        }

        // =======================================================
        // 4. MOBILNÉ & PC OVLÁDANIE
        // =======================================================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        let mousePos = { x: canvas.width / 2, y: canvas.height / 2 };
        let isBoosting = false;

        // PC Ovládanie myšou a klávesnicou
        window.addEventListener("mousemove", (e) => {
            if (!isAutoplay) {
                mousePos.x = e.clientX;
                mousePos.y = e.clientY;
            }
        });
        window.addEventListener("mousedown", (e) => {
            if (e.button === 0 && !isAutoplay) isBoosting = true;
        });
        window.addEventListener("mouseup", (e) => {
            if (e.button === 0 && !isAutoplay) isBoosting = false;
        });
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" && !isAutoplay) isBoosting = true;
        });
        window.addEventListener("keyup", (e) => {
            if (e.code === "Space" && !isAutoplay) isBoosting = false;
        });

        // MOBILNÉ DOTYKOVÉ OVLÁDANIE (TOUCH DRAG)
        function handleTouch(e) {
            if (isAutoplay) isAutoplay = false; // Dotyk hráča zruší autoplay
            btnAutoplay.classList.remove("active");
            autoplayStatus.innerText = "OFF";

            if (e.touches.length > 0) {
                const touch = e.touches[0];
                // Zameranie smeru od stredu obrazovky
                mousePos.x = touch.clientX;
                mousePos.y = touch.clientY;
            }
        }

        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });
        canvas.addEventListener("touchmove", (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });

        // Mobilné tlačidlo BOOST
        const mobileBoostBtn = document.getElementById("mobile-boost-btn");
        mobileBoostBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            e.stopPropagation();
            isBoosting = true;
        }, { passive: false });

        mobileBoostBtn.addEventListener("touchend", (e) => {
            e.preventDefault();
            e.stopPropagation();
            isBoosting = false;
        }, { passive: false });

        // Podpora pre kliknutie na boost tlačidlo myšou
        mobileBoostBtn.addEventListener("mousedown", (e) => { e.stopPropagation(); isBoosting = true; });
        mobileBoostBtn.addEventListener("mouseup", (e) => { e.stopPropagation(); isBoosting = false; });

        // =======================================================
        // 5. HERNÁ MECHANIKA (35+ BOTOV, RAST, BÚRKA)
        // =======================================================
        const WORLD_SIZE = 4500;
        let gameRunning = false;

        let storm = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            radius: WORLD_SIZE * 0.75,
            shrinkRate: 0.16,
            timer: 180
        };

        let player = {
            x: WORLD_SIZE / 2 + (Math.random() - 0.5) * 600,
            y: WORLD_SIZE / 2 + (Math.random() - 0.5) * 600,
            radius: 14,
            speed: 3.8,
            boostSpeed: 6.2,
            angle: 0,
            health: 100,
            shield: 100,
            kills: 0,
            history: [],
            length: 18,
            nick: "Player",
            color: "#22c55e",
            alive: true
        };

        let remoteSnakes = {};
        let bots = [];

        const BOT_NAMES = [
            "Peely_Banana🍌", "Jonesy_OG", "Midas_Gold👑", "Renegade_Raider",
            "Fishstick_🐟", "Dark_Voyager", "Slurp_Boi", "Raven_X",
            "Travis_Scott", "Ninja_Bot", "Drift_Fox", "Skull_Trooper💀",
            "Cuddle_Team_Leader", "Galaxy_Warrior", "Default_Dan", "Llama_Lover",
            "Chug_Jugger", "Aura_Sweat", "Catalyst_Speed", "Black_Knight",
            "Sparkle_Specialist", "Omega_Max", "Raptor_Pilot", "Valor_Shield",
            "Havoc_Pro", "Rust_Lord", "Brite_Bomber", "Sun_Strider",
            "Beef_Boss🍔", "Tomato_Head🍅", "Dire_Wolf", "Zenith_Sniper",
            "Lynx_Cat", "Ice_King❄️", "Hybrid_Dragon", "Ember_Fire🔥"
        ];
        const BOT_COLORS = ["#ef4444", "#3b82f6", "#a855f7", "#ec4899", "#14b8a6", "#f97316", "#84cc16", "#e11d48"];

        let lootItems = [];
        for (let i = 0; i < 400; i++) spawnLootItem();

        function spawnLootItem(type = null) {
            let t = type || (Math.random() < 0.15 ? "slurp" : "xp");
            lootItems.push({
                x: Math.random() * WORLD_SIZE,
                y: Math.random() * WORLD_SIZE,
                type: t,
                radius: t === "slurp" ? 8 : 5
            });
        }

        for (let i = 0; i < 8; i++) {
            lootItems.push({ x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, type: "drop", radius: 18 });
        }

        function initBots() {
            bots = [];
            for (let i = 0; i < BOT_NAMES.length; i++) {
                bots.push({
                    nick: BOT_NAMES[i],
                    x: Math.random() * WORLD_SIZE,
                    y: Math.random() * WORLD_SIZE,
                    angle: Math.random() * Math.PI * 2,
                    speed: 3.2,
                    radius: 14,
                    length: 16 + Math.floor(Math.random() * 15),
                    history: [],
                    alive: true,
                    color: BOT_COLORS[i % BOT_COLORS.length],
                    health: 100
                });
            }
        }

        function addKillFeed(killer, victim) {
            const feed = document.getElementById("kill-feed");
            const div = document.createElement("div");
            div.className = "kill-row";
            div.innerHTML = `🎯 <b>${killer}</b> eliminoval <b>${victim}</b>`;
            feed.prepend(div);
            setTimeout(() => div.remove(), 5000);
        }

        function startGame() {
            initBots();
            gameRunning = true;
        }

        let lastMqttSend = 0;
        function update() {
            if (!gameRunning) return;

            // Spustenie Autoplay AI ak je zapnutý
            if (isAutoplay) {
                runAutoplayAI();
            }

            // Búrka
            if (storm.radius > 180) storm.radius -= storm.shrinkRate;
            if (storm.timer > 0) {
                storm.timer -= 1/60;
                let m = Math.floor(storm.timer / 60);
                let s = Math.floor(storm.timer % 60);
                document.getElementById("hud-storm-timer").innerText = `${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;
            }

            // Storm damage pre hráča
            let pDist = Math.hypot(player.x - storm.x, player.y - storm.y);
            if (pDist > storm.radius) {
                if (player.shield > 0) player.shield -= 0.3;
                else player.health -= 0.45;
                if (player.health <= 0 && player.alive) handleDeath("Búrka");
            }

            // Pohyb hráča
            if (player.alive) {
                if (!isAutoplay) {
                    let dx = mousePos.x - canvas.width / 2;
                    let dy = mousePos.y - canvas.height / 2;
                    player.angle = Math.atan2(dy, dx);
                }

                let curSpeed = player.speed;
                if (isBoosting && (player.shield > 0 || player.length > 15)) {
                    curSpeed = player.boostSpeed;
                    if (player.shield > 0) player.shield -= 0.25;
                }

                player.x += Math.cos(player.angle) * curSpeed;
                player.y += Math.sin(player.angle) * curSpeed;

                player.x = Math.max(20, Math.min(WORLD_SIZE - 20, player.x));
                player.y = Math.max(20, Math.min(WORLD_SIZE - 20, player.y));

                player.history.unshift({ x: player.x, y: player.y });
                if (player.history.length > player.length * 5) player.history.pop();

                // Kolízie s loot orbmi (KOLKO ZJEM, TOLKO RASTIEM)
                for (let i = lootItems.length - 1; i >= 0; i--) {
                    let loot = lootItems[i];
                    if (Math.hypot(player.x - loot.x, player.y - loot.y) < player.radius + loot.radius + 6) {
                        if (loot.type === "slurp") {
                            player.shield = Math.min(100, player.shield + 25);
                        } else if (loot.type === "drop") {
                            player.length += 8;
                            player.shield = 100;
                            player.health = 100;
                        } else {
                            player.length += 1; // Rast o 1 článok
                        }
                        lootItems.splice(i, 1);
                        spawnLootItem();
                    }
                }
            }

            // Update botov
            bots.forEach(b => {
                if (!b.alive) return;
                let dC = Math.hypot(b.x - storm.x, b.y - storm.y);
                if (dC > storm.radius * 0.8) {
                    b.angle = Math.atan2(storm.y - b.y, storm.x - b.x);
                } else if (Math.random() < 0.04) {
                    b.angle += (Math.random() - 0.5) * 1.5;
                }

                b.x += Math.cos(b.angle) * b.speed;
                b.y += Math.sin(b.angle) * b.speed;

                if (dC > storm.radius) {
                    b.health -= 0.5;
                    if (b.health <= 0) {
                        b.alive = false;
                        addKillFeed("Búrka", b.nick);
                    }
                }

                b.history.unshift({ x: b.x, y: b.y });
                if (b.history.length > b.length * 5) b.history.pop();

                // Súboj
                if (player.alive && Math.hypot(player.x - b.x, player.y - b.y) < player.radius + b.radius) {
                    if (player.length >= b.length) {
                        b.alive = false;
                        player.kills++;
                        player.length += Math.floor(b.length / 2);
                        addKillFeed(player.nick, b.nick);
                        pushReportToQueue("ELIMINATION", { killer: player.nick, victim: b.nick });
                        if (currentUser) {
                            currentUser.kills = (currentUser.kills || 0) + 1;
                            cloudUsersRegistry[currentUser.username] = currentUser;
                            pushUserRegistryToCloud();
                        }
                    } else {
                        handleDeath(b.nick);
                    }
                }
            });

            // Multiplayer kolízia so živými hráčmi
            for (let id in remoteSnakes) {
                let rp = remoteSnakes[id];
                if (player.alive && rp.body) {
                    for (let seg of rp.body) {
                        if (Math.hypot(player.x - seg.x, player.y - seg.y) < player.radius + 6) {
                            handleDeath(rp.nick);
                            break;
                        }
                    }
                }
            }

            // Odosielanie polohy cez EMQX Cloud MQTT
            if (isMqttConnected && currentUser && Date.now() - lastMqttSend > 90) {
                lastMqttSend = Date.now();
                const sampledBody = player.history.filter((_, idx) => idx % 4 === 0).slice(0, 30);
                const packet = {
                    x: Math.round(player.x),
                    y: Math.round(player.y),
                    nick: player.nick,
                    length: player.length,
                    alive: player.alive,
                    tier: currentUser.tier,
                    color: player.color,
                    body: sampledBody
                };
                const msg = new Paho.MQTT.Message(JSON.stringify(packet));
                msg.destinationName = TOPIC_MP_POS + currentUser.username;
                mqttClient.send(msg);
            }

            // HUD
            let aliveCount = (player.alive ? 1 : 0) + bots.filter(b => b.alive).length + Object.keys(remoteSnakes).length;
            document.getElementById("hud-alive").innerText = aliveCount;
            document.getElementById("hud-kills").innerText = player.kills;
            document.getElementById("hud-len").innerText = player.length;
            document.getElementById("val-shield").innerText = Math.round(player.shield);
            document.getElementById("bar-shield").style.width = player.shield + "%";
            document.getElementById("val-health").innerText = Math.max(0, Math.round(player.health));
            document.getElementById("bar-health").style.width = Math.max(0, player.health) + "%";

            // Victory Royale
            if (aliveCount <= 1 && player.alive) {
                document.getElementById("victory-screen").style.display = "flex";
                if (currentUser) {
                    currentUser.wins = (currentUser.wins || 0) + 1;
                    cloudUsersRegistry[currentUser.username] = currentUser;
                    pushUserRegistryToCloud();
                    pushReportToQueue("VICTORY_ROYALE", { winner: currentUser.username });
                }
                gameRunning = false;
            }
        }

        function handleDeath(killer) {
            player.alive = false;
            addKillFeed(killer, player.nick);
            pushReportToQueue("PLAYER_DIED", { victim: player.nick, killer: killer });
            setTimeout(() => {
                alert(`💀 Bol si eliminovaný (${killer})!`);
                location.reload();
            }, 800);
        }

        // =======================================================
        // 6. RENDER (CANVAS)
        // =======================================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let camX = player.x - canvas.width / 2;
            let camY = player.y - canvas.height / 2;

            ctx.save();
            ctx.translate(-camX, -camY);

            ctx.fillStyle = "#0c1220";
            ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            ctx.strokeStyle = "#162035";
            ctx.lineWidth = 2;
            for (let x = 0; x <= WORLD_SIZE; x += 100) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
            }
            for (let y = 0; y <= WORLD_SIZE; y += 100) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
            }

            lootItems.forEach(l => {
                if (l.type === "drop") {
                    ctx.fillStyle = "#0284c7";
                    ctx.fillRect(l.x - 12, l.y - 12, 24, 24);
                    ctx.strokeStyle = "#ffe600";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(l.x - 12, l.y - 12, 24, 24);
                } else {
                    ctx.fillStyle = l.type === "slurp" ? "#38bdf8" : "#4ade80";
                    ctx.beginPath();
                    ctx.arc(l.x, l.y, l.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            bots.forEach(b => {
                if (b.alive) renderSnake(b.history, b.radius, b.color, b.nick, false);
            });

            for (let id in remoteSnakes) {
                let rp = remoteSnakes[id];
                if (rp.body && rp.body.length > 0) {
                    renderSnake(rp.body, 14, rp.color || "#eab308", rp.nick, rp.tier === "premium");
                }
            }

            if (player.alive) {
                renderSnake(player.history, player.radius, player.color, (isAutoplay ? "🤖 " : "") + player.nick, currentUser && currentUser.tier === "premium");
            }

            // Búrka (Storm)
            ctx.save();
            ctx.strokeStyle = "#c084fc";
            ctx.lineWidth = 14;
            ctx.shadowColor = "#d946ef";
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(storm.x, storm.y, storm.radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "rgba(147, 51, 234, 0.18)";
            ctx.rect(0, 0, WORLD_SIZE, WORLD_SIZE);
            ctx.arc(storm.x, storm.y, storm.radius, 0, Math.PI * 2, true);
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        function renderSnake(history, baseRadius, color, nick, isVip) {
            if (history.length === 0) return;

            for (let i = history.length - 1; i >= 0; i -= 2) {
                let pt = history[i];
                let ratio = 1 - (i / history.length) * 0.45;
                ctx.fillStyle = isVip ? "#f59e0b" : color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, baseRadius * ratio, 0, Math.PI * 2);
                ctx.fill();
            }

            let head = history[0];
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(head.x, head.y, baseRadius + 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#fff";
            ctx.font = "900 11px Montserrat";
            ctx.textAlign = "center";
            ctx.fillText((isVip ? "👑 " : "") + nick, head.x, head.y - 18);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        connectMQTT();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
