<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fortnite: Snake Royale - Cloud Account Edition</title>
    <!-- Paho MQTT cez CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Montserrat:ital,wght@0,600;0,800;0,900;1,900&display=swap');

        :root {
            --fn-yellow: #ffe600;
            --fn-blue: #00a8ff;
            --fn-purple: #9d4edd;
            --fn-dark: #0e1322;
            --fn-panel: rgba(18, 25, 44, 0.95);
            --vip-gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--fn-dark);
            font-family: 'Montserrat', sans-serif;
            color: #fff;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* EPIC PROFILE BAR (Hore vpravo) */
        .user-top-badge {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--fn-panel);
            padding: 8px 16px;
            border-radius: 40px;
            border: 2px solid rgba(255, 230, 0, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            z-index: 30;
        }

        .avatar-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--fn-yellow);
        }

        .user-meta {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .user-name-txt {
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge-vip {
            background: linear-gradient(135deg, #f59e0b, #ffe600);
            color: #000;
            font-size: 9px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .badge-free {
            background: #475569;
            color: #cbd5e1;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* FORTNITE HUD TOP */
        .hud-center {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 25px;
            background: var(--fn-panel);
            padding: 10px 24px;
            border-radius: 35px;
            border: 2px solid var(--fn-yellow);
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.25);
            z-index: 20;
        }

        .hud-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-title {
            font-size: 9px;
            font-weight: 900;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hud-val {
            font-family: 'Luckiest Guy', cursive;
            font-size: 22px;
            color: var(--fn-yellow);
            text-shadow: 2px 2px 0 #000;
        }

        /* HEALTH & SHIELD */
        .hud-bottom-left {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            background: rgba(14, 19, 34, 0.85);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bar-wrap {
            width: 200px;
            height: 14px;
            background: #1e293b;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill-shield { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); transition: width .15s; }
        .bar-fill-health { height: 100%; background: linear-gradient(90deg, #16a34a, #4ade80); transition: width .15s; }
        .bar-txt {
            position: absolute; inset: 0;
            text-align: center; font-size: 9px; font-weight: 900; line-height: 14px;
            text-shadow: 1px 1px 1px #000;
        }

        /* KILL FEED */
        .kill-feed {
            position: absolute;
            top: 80px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
            pointer-events: none;
        }

        .kill-row {
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            border-left: 4px solid #ef4444;
            animation: fadeOut 5s forwards;
        }

        /* EPIC / FORTNITE LOGIN MODAL */
        .modal-screen {
            position: absolute;
            inset: 0;
            background: rgba(6, 9, 18, 0.94);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .epic-auth-box {
            background: #131a2e;
            border: 3px solid var(--fn-yellow);
            border-radius: 20px;
            width: 480px;
            max-width: 95vw;
            padding: 30px;
            box-shadow: 0 0 50px rgba(255, 230, 0, 0.25);
            text-align: center;
        }

        .epic-auth-box h1 {
            font-family: 'Luckiest Guy', cursive;
            font-size: 36px;
            color: var(--fn-yellow);
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 #000;
        }

        .tab-btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #1e293b;
            border: none;
            color: #94a3b8;
            font-weight: 900;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;
        }

        .tab-btn.active {
            background: var(--fn-yellow);
            color: #000;
        }

        .f-input {
            width: 100%;
            background: #0a0f1d;
            border: 2px solid #334155;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .f-input:focus {
            border-color: var(--fn-yellow);
        }

        .btn-yellow {
            width: 100%;
            background: var(--fn-yellow);
            color: #000;
            font-family: 'Luckiest Guy', cursive;
            font-size: 22px;
            padding: 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 0 #b3a100;
            transition: .1s;
            margin-top: 5px;
        }

        .btn-yellow:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #b3a100;
        }

        .btn-yellow:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b3a100;
        }

        .btn-vip-upgrade {
            background: linear-gradient(135deg, #f59e0b, #ffe600);
            color: #000;
            font-weight: 900;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            margin-left: 10px;
        }

        /* VICTORY OVERLAY */
        #victory-screen {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(10, 10, 20, 0.95) 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 80;
        }

        .vic-title {
            font-family: 'Luckiest Guy', cursive;
            font-size: 70px;
            color: var(--fn-yellow);
            text-shadow: 4px 5px 0 #000, 0 0 35px var(--fn-yellow);
            transform: rotate(-3deg);
            margin-bottom: 15px;
        }

        @keyframes fadeOut {
            0% { opacity: 0; transform: translateX(20px); }
            10% { opacity: 1; transform: translateX(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- HORNÝ PROFILOVÝ PANEL (EPIC PROFILE) -->
    <div class="user-top-badge" id="profile-pill" style="display:none;">
        <img id="pill-avatar" class="avatar-img" src="" alt="Avatar">
        <div class="user-meta">
            <div class="user-name-txt">
                <span id="pill-nick">Player</span>
                <span id="pill-tier" class="badge-free">FREE</span>
            </div>
            <span style="font-size: 10px; color:#94a3b8;" id="pill-wins">Wins: 0</span>
        </div>
        <button class="btn-vip-upgrade" id="btn-buy-vip">👑 KÚPIŤ BATTLE PASS VIP</button>
        <button style="background:transparent; border:none; color:#ef4444; font-weight:800; cursor:pointer; font-size:11px;" id="btn-logout">LOGOUT</button>
    </div>

    <!-- HUD FORTNITE BATTLE ROYALE -->
    <div class="hud-center">
        <div class="hud-stat">
            <span class="hud-title">NAŽIVE</span>
            <span class="hud-val" id="hud-alive">25</span>
        </div>
        <div class="hud-stat">
            <span class="hud-title">ELIMINÁCIE</span>
            <span class="hud-val" id="hud-kills">0</span>
        </div>
        <div class="hud-stat">
            <span class="hud-title" style="color:#d946ef;">BÚRKA SA SŤAHUJE</span>
            <span class="hud-val" style="color:#d946ef;" id="hud-storm-timer">02:30</span>
        </div>
        <div class="hud-stat">
            <span class="hud-title">DĹŽKA HADÍKA</span>
            <span class="hud-val" id="hud-len">18</span>
        </div>
    </div>

    <!-- SHIELD & HP -->
    <div class="hud-bottom-left">
        <div class="bar-wrap">
            <div class="bar-fill-shield" id="bar-shield" style="width: 100%;"></div>
            <div class="bar-txt">SHIELD <span id="val-shield">100</span>/100</div>
        </div>
        <div class="bar-wrap">
            <div class="bar-fill-health" id="bar-health" style="width: 100%;"></div>
            <div class="bar-txt">ZDRAVIE <span id="val-health">100</span>/100</div>
        </div>
    </div>

    <!-- KILL FEED -->
    <div class="kill-feed" id="kill-feed"></div>

    <!-- VICTORY ROYALE #1 -->
    <div id="victory-screen">
        <h1 class="vic-title">#1 VICTORY ROYALE</h1>
        <p style="font-size: 20px; font-weight: 800; margin-bottom: 25px;">Vyhral si zápas v Snake Royale!</p>
        <button class="btn-yellow" style="max-width: 250px;" onclick="location.reload()">HRAŤ ZNOVA</button>
    </div>

    <!-- MODÁL: PRIHLÁSENIE / REGISTRÁCIA FORTNITE ÚČTU -->
    <div class="modal-screen" id="auth-modal">
        <div class="epic-auth-box">
            <h1>EPIC GAMES ACCOUNT</h1>
            <p style="font-size: 11px; color:#94a3b8; margin-bottom: 18px;">Ukladá sa perzistentne do EMQX Cloud MQTT Databázy</p>

            <div class="tab-btn-row">
                <button class="tab-btn active" id="tab-login-btn">PRIHLÁSIŤ SA</button>
                <button class="tab-btn" id="tab-reg-btn">VYTVORIŤ NOVÝ ÚČET</button>
            </div>

            <!-- Formulár Prihlásenia -->
            <div id="form-login">
                <input type="text" id="log-username" class="f-input" placeholder="Epic Meno / Username">
                <input type="password" id="log-pass" class="f-input" placeholder="Heslo">
                <button class="btn-yellow" id="btn-submit-login">PRIHLÁSIŤ A HRAŤ</button>
            </div>

            <!-- Formulár Registrácie -->
            <div id="form-register" style="display: none;">
                <input type="text" id="reg-username" class="f-input" placeholder="Nové Epic Meno (GamerTag)">
                <input type="password" id="reg-pass" class="f-input" placeholder="Heslo">
                
                <div style="text-align:left; font-size:11px; color:#94a3b8; margin-bottom:6px;">PROFILOVÁ FOTKA (AVATAR DO VAULT KATALÓGU):</div>
                <input type="file" id="reg-avatar-file" class="f-input" accept="image/*">

                <button class="btn-yellow" id="btn-submit-register">ZAREGISTROVAŤ ÚČET</button>
            </div>

            <!-- Výber mapy -->
            <div style="margin-top: 15px; text-align: left;">
                <label style="font-size:11px; font-weight:800; color:#94a3b8;">MAPA (BIÓM):</label>
                <select id="map-select" class="f-input" style="margin-top:4px;">
                    <option value="pleasant">🌳 Pleasant Meadows (Klasická Zelená)</option>
                    <option value="desert">🏜️ Paradise Desert (Púštny Kaňon)</option>
                    <option value="frosty">❄️ Frosty Peaks (Zimný Ľadovec)</option>
                    <option value="kevin">🔮 Kevin's Realm (Fialová Dimenzia)</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        // =======================================================
        // 1. DÁTOVÁ ARCHITEKTÚRA EMQX CLOUD MQTT (PRESNE ZO ZADANIA)
        // =======================================================
        const MQTT_BROKER = "broker.emqx.io";
        const MQTT_PORT = 8084;
        const MQTT_PATH = "/mqtt";
        const CLIENT_ID = "fn_acc_" + Math.random().toString(16).substring(2, 10);

        // Perzistentné MQTT Topics (retained = true)
        const TOPIC_VAULT = "dankermax/v1/vault_catalog";     // Katalóg fotiek/avatarov
        const TOPIC_USERS = "dankermax/v1/users_registry";     // Databáza používateľov (Free / Premium VIP)
        const TOPIC_REPORTS = "dankermax/v1/reports_queue";   // Hlásenia a transakcie
        const TOPIC_MP_POS = "dankermax/v1/snake_game/positions/";

        let mqttClient = null;
        let isMqttConnected = false;

        // Globálne pamäťové cache (synchronizované z cloudu)
        let cloudUsersRegistry = {}; // id -> { id, username, pass, displayName, tier, wins, avatarUrl }
        let cloudVaultCatalog = [];  // [ { id, name, base64, tier, timestamp } ]

        // Aktuálny lokálny prihlásený používateľ
        let currentUser = JSON.parse(localStorage.getItem("fn_cloud_session")) || null;

        // Predvolený Fortnite avatar (Jonesy)
        const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffe600'/><circle cx='35' cy='42' r='8' fill='%23000'/><circle cx='65' cy='42' r='8' fill='%23000'/><path d='M30 65 Q50 85 70 65' stroke='%23000' stroke-width='6' fill='none'/></svg>";

        function connectMQTT() {
            mqttClient = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, MQTT_PATH, CLIENT_ID);

            mqttClient.onConnectionLost = () => {
                isMqttConnected = false;
                setTimeout(connectMQTT, 3000);
            };

            mqttClient.onMessageArrived = (message) => {
                try {
                    const topic = message.destinationName;
                    const payload = JSON.parse(message.payloadString);

                    // A) Používateľská databáza (Users Registry)
                    if (topic === TOPIC_USERS) {
                        cloudUsersRegistry = Object.assign(cloudUsersRegistry, payload);
                        localStorage.setItem("fn_cached_registry", JSON.stringify(cloudUsersRegistry));
                        
                        // Ak sme prihlásení, synchronizujeme aktuálny stav (napr. VIP status)
                        if (currentUser && cloudUsersRegistry[currentUser.username]) {
                            currentUser = cloudUsersRegistry[currentUser.username];
                            localStorage.setItem("fn_cloud_session", JSON.stringify(currentUser));
                            updateProfileUI();
                        }
                    }

                    // B) Katalóg fotografií (Vault Catalog)
                    if (topic === TOPIC_VAULT) {
                        cloudVaultCatalog = payload;
                    }

                    // C) Multiplayer pozície
                    if (topic.startsWith(TOPIC_MP_POS)) {
                        const sender = topic.split("/").pop();
                        if (currentUser && sender !== currentUser.username && payload.alive) {
                            remoteSnakes[sender] = { ...payload, lastUpdate: Date.now() };
                        } else if (!payload.alive) {
                            delete remoteSnakes[sender];
                        }
                    }
                } catch (e) {
                    console.error("Chyba spracovania MQTT dát:", e);
                }
            };

            mqttClient.connect({
                useSSL: true,
                timeout: 5,
                onSuccess: () => {
                    isMqttConnected = true;
                    // Odbery perzistentných tém
                    mqttClient.subscribe(TOPIC_USERS, { qos: 1 });
                    mqttClient.subscribe(TOPIC_VAULT, { qos: 1 });
                    mqttClient.subscribe(TOPIC_MP_POS + "+", { qos: 0 });

                    // Auto-login ak existuje lokálna session
                    if (currentUser) {
                        applyLogin(currentUser);
                    }
                },
                onFailure: () => setTimeout(connectMQTT, 4000)
            });
        }

        // Uloženie používateľov do cloudu (Retained = true)
        function pushUserRegistryToCloud() {
            if (!isMqttConnected) return;
            const msg = new Paho.MQTT.Message(JSON.stringify(cloudUsersRegistry));
            msg.destinationName = TOPIC_USERS;
            msg.retained = true;
            msg.qos = 1;
            mqttClient.send(msg);
        }

        // Zápis fotografie do Vault Katalógu (Retained = true)
        function pushPhotoToVaultCatalog(photoObj) {
            if (!isMqttConnected) return;
            cloudVaultCatalog.push(photoObj);
            const msg = new Paho.MQTT.Message(JSON.stringify(cloudVaultCatalog));
            msg.destinationName = TOPIC_VAULT;
            msg.retained = true;
            msg.qos = 1;
            mqttClient.send(msg);
        }

        // Zápis hlásenia do Reports Queue
        function pushReportToQueue(action, details) {
            if (!isMqttConnected) return;
            const report = {
                id: "TX_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
                action: action,
                user: currentUser ? currentUser.username : "guest",
                details: details,
                timestamp: new Date().toISOString()
            };
            const msg = new Paho.MQTT.Message(JSON.stringify(report));
            msg.destinationName = TOPIC_REPORTS;
            msg.qos = 0;
            mqttClient.send(msg);
        }

        // =======================================================
        // 2. AUTH SYSTÉM (REGISTRÁCIA, LOGIN, VIP NÁKUP)
        // =======================================================
        const tabLoginBtn = document.getElementById("tab-login-btn");
        const tabRegBtn = document.getElementById("tab-reg-btn");
        const formLogin = document.getElementById("form-login");
        const formRegister = document.getElementById("form-register");

        tabLoginBtn.onclick = () => {
            tabLoginBtn.classList.add("active");
            tabRegBtn.classList.remove("active");
            formLogin.style.display = "block";
            formRegister.style.display = "none";
        };

        tabRegBtn.onclick = () => {
            tabRegBtn.classList.add("active");
            tabLoginBtn.classList.remove("active");
            formRegister.style.display = "block";
            formLogin.style.display = "none";
        };

        // Registrácia
        document.getElementById("btn-submit-register").onclick = () => {
            const username = document.getElementById("reg-username").value.trim();
            const pass = document.getElementById("reg-pass").value.trim();
            const avatarFile = document.getElementById("reg-avatar-file").files[0];

            if (!username || !pass) {
                alert("Zadaj meno aj heslo!");
                return;
            }

            if (cloudUsersRegistry[username]) {
                alert("Používateľ s týmto Epic Menom už existuje!");
                return;
            }

            // Spracovanie avataru do Base64
            if (avatarFile) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64Img = e.target.result;
                    completeRegistration(username, pass, base64Img);
                };
                reader.readAsDataURL(avatarFile);
            } else {
                completeRegistration(username, pass, DEFAULT_AVATAR);
            }
        };

        function completeRegistration(username, pass, avatarBase64) {
            const newUser = {
                id: "USR_" + Date.now(),
                username: username,
                pass: pass,
                tier: "free", // Predvolene Free
                wins: 0,
                avatar: avatarBase64,
                createdAt: new Date().toISOString()
            };

            // 1. Zápis avatara do vault_catalog
            pushPhotoToVaultCatalog({
                id: "IMG_" + Date.now(),
                name: username + "_avatar",
                base64: avatarBase64,
                tier: "free",
                timestamp: Date.now()
            });

            // 2. Zápis do databázy používateľov (users_registry)
            cloudUsersRegistry[username] = newUser;
            pushUserRegistryToCloud();

            // 3. Log transakcie do reports_queue
            pushReportToQueue("USER_REGISTERED", { username: username, tier: "free" });

            applyLogin(newUser);
        }

        // Prihlásenie
        document.getElementById("btn-submit-login").onclick = () => {
            const username = document.getElementById("log-username").value.trim();
            const pass = document.getElementById("log-pass").value.trim();

            if (!username || !pass) {
                alert("Vyplň prihlasovacie údaje!");
                return;
            }

            const user = cloudUsersRegistry[username];
            if (!user || user.pass !== pass) {
                alert("Nesprávne Epic Meno alebo heslo!");
                return;
            }

            pushReportToQueue("USER_LOGIN", { username: username });
            applyLogin(user);
        };

        function applyLogin(user) {
            currentUser = user;
            localStorage.setItem("fn_cloud_session", JSON.stringify(currentUser));
            
            document.getElementById("auth-modal").style.display = "none";
            document.getElementById("profile-pill").style.display = "flex";

            player.nick = user.username;
            player.color = user.tier === "premium" ? "#ffd700" : "#22c55e"; // VIP má zlatého hada!
            
            updateProfileUI();
            startGame();
        }

        function updateProfileUI() {
            if (!currentUser) return;
            document.getElementById("pill-nick").innerText = currentUser.username;
            document.getElementById("pill-avatar").src = currentUser.avatar || DEFAULT_AVATAR;
            document.getElementById("pill-wins").innerText = `Wins: ${currentUser.wins || 0}`;

            const tierSpan = document.getElementById("pill-tier");
            const btnVip = document.getElementById("btn-buy-vip");

            if (currentUser.tier === "premium") {
                tierSpan.className = "badge-vip";
                tierSpan.innerText = "VIP PASS";
                btnVip.style.display = "none";
            } else {
                tierSpan.className = "badge-free";
                tierSpan.innerText = "FREE";
                btnVip.style.display = "inline-block";
            }
        }

        // Kúpa Premium VIP (Battle Pass)
        document.getElementById("btn-buy-vip").onclick = () => {
            if (!currentUser) return;
            if (confirm("Chceš aktivovať Fortnite Battle Pass VIP? Odomkne sa Zlatý Hadík a VIP Korunka!")) {
                currentUser.tier = "premium";
                cloudUsersRegistry[currentUser.username] = currentUser;
                
                // Uloženie do perzistentnej databázy
                pushUserRegistryToCloud();
                pushReportToQueue("PURCHASE_VIP_PASS", { username: currentUser.username, tier: "premium" });
                
                player.color = "#ffd700";
                updateProfileUI();
                addKillFeed("SYSTEM", `${currentUser.username} odomkol BATTLE PASS VIP! 👑`);
            }
        };

        // Odhlásenie
        document.getElementById("btn-logout").onclick = () => {
            localStorage.removeItem("fn_cloud_session");
            location.reload();
        };

        // =======================================================
        // 3. FORTNITE SNAKE ROYALE HERNÁ LOGIKA
        // =======================================================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        const WORLD_SIZE = 3600;
        let gameRunning = false;
        let isBoosting = false;
        let mousePos = { x: canvas.width / 2, y: canvas.height / 2 };

        // Búrka (Storm)
        let storm = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            radius: WORLD_SIZE * 0.7,
            shrinkRate: 0.16,
            timer: 150
        };

        // Hráč
        let player = {
            x: WORLD_SIZE / 2 + (Math.random() - 0.5) * 500,
            y: WORLD_SIZE / 2 + (Math.random() - 0.5) * 500,
            radius: 14,
            speed: 3.8,
            boostSpeed: 6.2,
            angle: 0,
            health: 100,
            shield: 100,
            score: 0,
            kills: 0,
            history: [],
            length: 18, // Rastie každým jedlom!
            nick: "Player",
            color: "#22c55e",
            alive: true
        };

        // Boti & Sieťoví hráči
        let remoteSnakes = {};
        let bots = [];
        const BOT_NAMES = ["Peely_🍌", "Jonesy_OG", "Midas_Gold", "Renegade_Raider", "Fishstick_🐟", "Dark_Voyager", "Slurp_Boi", "Raven_X"];
        const BOT_COLORS = ["#ef4444", "#3b82f6", "#a855f7", "#ec4899", "#14b8a6", "#f97316"];

        let lootItems = [];
        for (let i = 0; i < 260; i++) spawnLootItem();

        function spawnLootItem(type = null) {
            let selectedType = type || (Math.random() < 0.15 ? "slurp" : "xp");
            lootItems.push({
                x: Math.random() * WORLD_SIZE,
                y: Math.random() * WORLD_SIZE,
                type: selectedType,
                radius: selectedType === "slurp" ? 8 : 5
            });
        }

        // Supply Drop Bedne
        for (let i = 0; i < 6; i++) {
            lootItems.push({ x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, type: "drop", radius: 18 });
        }

        function initBots() {
            bots = [];
            for (let i = 0; i < BOT_NAMES.length; i++) {
                bots.push({
                    nick: BOT_NAMES[i],
                    x: Math.random() * WORLD_SIZE,
                    y: Math.random() * WORLD_SIZE,
                    angle: Math.random() * Math.PI * 2,
                    speed: 3.2,
                    radius: 14,
                    length: 18 + Math.floor(Math.random() * 12),
                    history: [],
                    alive: true,
                    color: BOT_COLORS[i % BOT_COLORS.length],
                    health: 100
                });
            }
        }

        // Ovládanie
        window.addEventListener("mousemove", (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;
        });

        window.addEventListener("mousedown", (e) => { if (e.button === 0) isBoosting = true; });
        window.addEventListener("mouseup", (e) => { if (e.button === 0) isBoosting = false; });
        window.addEventListener("keydown", (e) => { if (e.code === "Space") isBoosting = true; });
        window.addEventListener("keyup", (e) => { if (e.code === "Space") isBoosting = false; });

        function addKillFeed(killer, victim) {
            const feed = document.getElementById("kill-feed");
            const div = document.createElement("div");
            div.className = "kill-row";
            div.innerHTML = `🎯 <b>${killer}</b> eliminoval <b>${victim}</b>`;
            feed.prepend(div);
            setTimeout(() => div.remove(), 5000);
        }

        function startGame() {
            initBots();
            gameRunning = true;
        }

        // Hlavný update
        let lastMqttSend = 0;
        function update() {
            if (!gameRunning) return;

            // Zmenšovanie búrky
            if (storm.radius > 160) storm.radius -= storm.shrinkRate;
            if (storm.timer > 0) {
                storm.timer -= 1/60;
                let m = Math.floor(storm.timer / 60);
                let s = Math.floor(storm.timer % 60);
                document.getElementById("hud-storm-timer").innerText = `${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;
            }

            // Poškodenie búrkou
            let pDist = Math.hypot(player.x - storm.x, player.y - storm.y);
            if (pDist > storm.radius) {
                if (player.shield > 0) player.shield -= 0.3;
                else player.health -= 0.4;
                if (player.health <= 0 && player.alive) handleDeath("Búrka");
            }

            // Pohyb hráča
            if (player.alive) {
                let dx = mousePos.x - canvas.width / 2;
                let dy = mousePos.y - canvas.height / 2;
                player.angle = Math.atan2(dy, dx);

                let curSpeed = player.speed;
                if (isBoosting && (player.shield > 0 || player.length > 15)) {
                    curSpeed = player.boostSpeed;
                    if (player.shield > 0) player.shield -= 0.2;
                }

                player.x += Math.cos(player.angle) * curSpeed;
                player.y += Math.sin(player.angle) * curSpeed;

                player.x = Math.max(20, Math.min(WORLD_SIZE - 20, player.x));
                player.y = Math.max(20, Math.min(WORLD_SIZE - 20, player.y));

                player.history.unshift({ x: player.x, y: player.y });
                if (player.history.length > player.length * 5) player.history.pop();

                // Kolízie s loot orbmi (KOLKO ZJEM, TOLKO RASTIEM)
                for (let i = lootItems.length - 1; i >= 0; i--) {
                    let loot = lootItems[i];
                    if (Math.hypot(player.x - loot.x, player.y - loot.y) < player.radius + loot.radius + 6) {
                        if (loot.type === "slurp") {
                            player.shield = Math.min(100, player.shield + 25);
                        } else if (loot.type === "drop") {
                            player.length += 8; // RAST O 8
                            player.shield = 100;
                            player.health = 100;
                        } else {
                            player.length += 1; // RAST O 1 ČLÁNOK ZA JEDLO
                        }
                        lootItems.splice(i, 1);
                        spawnLootItem();
                    }
                }
            }

            // Boti AI
            bots.forEach(b => {
                if (!b.alive) return;
                let dC = Math.hypot(b.x - storm.x, b.y - storm.y);
                if (dC > storm.radius * 0.8) {
                    b.angle = Math.atan2(storm.y - b.y, storm.x - b.x);
                } else if (Math.random() < 0.04) {
                    b.angle += (Math.random() - 0.5) * 1.5;
                }

                b.x += Math.cos(b.angle) * b.speed;
                b.y += Math.sin(b.angle) * b.speed;

                if (dC > storm.radius) {
                    b.health -= 0.5;
                    if (b.health <= 0) {
                        b.alive = false;
                        addKillFeed("Búrka", b.nick);
                    }
                }

                b.history.unshift({ x: b.x, y: b.y });
                if (b.history.length > b.length * 5) b.history.pop();

                // Súboj s botom
                if (player.alive && Math.hypot(player.x - b.x, player.y - b.y) < player.radius + b.radius) {
                    if (player.length >= b.length) {
                        b.alive = false;
                        player.kills++;
                        player.length += Math.floor(b.length / 2); // Zjedenie celého bota!
                        addKillFeed(player.nick, b.nick);
                        pushReportToQueue("ELIMINATION", { killer: player.nick, victim: b.nick });
                    } else {
                        handleDeath(b.nick);
                    }
                }
            });

            // Odosielanie polohy cez EMQX Cloud MQTT
            if (isMqttConnected && currentUser && Date.now() - lastMqttSend > 100) {
                lastMqttSend = Date.now();
                const packet = {
                    x: Math.round(player.x),
                    y: Math.round(player.y),
                    nick: player.nick,
                    length: player.length,
                    alive: player.alive,
                    tier: currentUser.tier,
                    color: player.color
                };
                const msg = new Paho.MQTT.Message(JSON.stringify(packet));
                msg.destinationName = TOPIC_MP_POS + currentUser.username;
                mqttClient.send(msg);
            }

            // HUD štatistiky
            let aliveCount = (player.alive ? 1 : 0) + bots.filter(b => b.alive).length + Object.keys(remoteSnakes).length;
            document.getElementById("hud-alive").innerText = aliveCount;
            document.getElementById("hud-kills").innerText = player.kills;
            document.getElementById("hud-len").innerText = player.length;
            document.getElementById("val-shield").innerText = Math.round(player.shield);
            document.getElementById("bar-shield").style.width = player.shield + "%";
            document.getElementById("val-health").innerText = Math.max(0, Math.round(player.health));
            document.getElementById("bar-health").style.width = Math.max(0, player.health) + "%";

            // Victory Royale podmienka
            if (aliveCount <= 1 && player.alive) {
                document.getElementById("victory-screen").style.display = "flex";
                if (currentUser) {
                    currentUser.wins = (currentUser.wins || 0) + 1;
                    cloudUsersRegistry[currentUser.username] = currentUser;
                    pushUserRegistryToCloud();
                    pushReportToQueue("VICTORY_ROYALE", { winner: currentUser.username });
                }
                gameRunning = false;
            }
        }

        function handleDeath(killer) {
            player.alive = false;
            addKillFeed(killer, player.nick);
            pushReportToQueue("PLAYER_DIED", { victim: player.nick, killer: killer });
            setTimeout(() => {
                alert(`💀 Bol si eliminovaný (${killer})!`);
                location.reload();
            }, 800);
        }

        // =======================================================
        // 4. VYKRESLOVANIE (RENDER CANVAPU)
        // =======================================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let camX = player.x - canvas.width / 2;
            let camY = player.y - canvas.height / 2;

            ctx.save();
            ctx.translate(-camX, -camY);

            // Pozadie mapy
            ctx.fillStyle = "#0d1424";
            ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            // Mriežka
            ctx.strokeStyle = "#162038";
            ctx.lineWidth = 2;
            for (let x = 0; x <= WORLD_SIZE; x += 90) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
            }
            for (let y = 0; y <= WORLD_SIZE; y += 90) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
            }

            // Loot Orby
            lootItems.forEach(l => {
                if (l.type === "drop") {
                    ctx.fillStyle = "#0284c7";
                    ctx.fillRect(l.x - 12, l.y - 12, 24, 24);
                    ctx.strokeStyle = "#ffe600";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(l.x - 12, l.y - 12, 24, 24);
                } else {
                    ctx.fillStyle = l.type === "slurp" ? "#38bdf8" : "#4ade80";
                    ctx.beginPath();
                    ctx.arc(l.x, l.y, l.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Boti
            bots.forEach(b => {
                if (b.alive) renderSnake(b.history, b.radius, b.color, b.nick, false);
            });

            // Multiplayer hráči
            for (let id in remoteSnakes) {
                let rp = remoteSnakes[id];
                ctx.fillStyle = rp.color || "#ff0055";
                ctx.beginPath();
                ctx.arc(rp.x, rp.y, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.font = "bold 12px Montserrat";
                ctx.fillText(rp.nick + (rp.tier === 'premium' ? " 👑" : ""), rp.x - 20, rp.y - 20);
            }

            // Hráč
            if (player.alive) {
                renderSnake(player.history, player.radius, player.color, player.nick, currentUser && currentUser.tier === "premium");
            }

            // Búrka (Storm)
            ctx.save();
            ctx.strokeStyle = "#c084fc";
            ctx.lineWidth = 14;
            ctx.shadowColor = "#d946ef";
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(storm.x, storm.y, storm.radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "rgba(147, 51, 234, 0.18)";
            ctx.rect(0, 0, WORLD_SIZE, WORLD_SIZE);
            ctx.arc(storm.x, storm.y, storm.radius, 0, Math.PI * 2, true);
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        function renderSnake(history, baseRadius, color, nick, isVip) {
            if (history.length === 0) return;

            for (let i = history.length - 1; i >= 0; i -= 4) {
                let pt = history[i];
                let ratio = 1 - (i / history.length) * 0.45;
                ctx.fillStyle = isVip ? "#f59e0b" : color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, baseRadius * ratio, 0, Math.PI * 2);
                ctx.fill();
            }

            let head = history[0];
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(head.x, head.y, baseRadius + 2, 0, Math.PI * 2);
            ctx.fill();

            // Meno s korunkou ak je VIP
            ctx.fillStyle = "#fff";
            ctx.font = "900 12px Montserrat";
            ctx.textAlign = "center";
            ctx.fillText((isVip ? "👑 " : "") + nick, head.x, head.y - 20);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Štart siete a hernej slučky
        connectMQTT();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
